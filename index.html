<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp cưới Bạch Dương &amp; Minh Tiến</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Mulish:wght@400;600;700&family=Allura&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f6;--fg:#161212;--mut:#5d5555;--card:#d9d9d9;--line:#d9777a;--ph:#e8e0dc;--ac:#8a8a8c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171313;--fg:#f5eeee;--mut:#b9adad;--card:#3a3434;--ph:#2c2626;--ac:#6c6c6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171313;--fg:#f5eeee;--mut:#b9adad;--card:#3a3434;--ph:#2c2626;--ac:#6c6c6e;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:'Mulish',sans-serif;line-height:1.55;display:flex;justify-content:center}
#app{width:100%;max-width:480px;overflow:hidden;background:var(--bg)}
section{padding:36px 20px;text-align:center}
h2{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;line-height:1.2}
.script{font-family:'Allura',cursive;font-weight:400}
.ph{position:relative;background:var(--ph);overflow:hidden;display:block;transition:transform .5s,box-shadow .5s;cursor:default}
.im{position:absolute;inset:0;background:center/cover no-repeat}
#tb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;margin:auto;max-width:464px;z-index:60;display:none;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px}
#tb button,.tbb{border:1px solid var(--fg);background:transparent;color:var(--fg);border-radius:16px;padding:6px 10px;font:700 12px 'Mulish',sans-serif;cursor:pointer}
.tbb{background:var(--line)!important;color:#fff!important;border-color:var(--line)!important}
.vh{position:fixed;left:-9999px;opacity:0}
.ph.empty::before{content:"Ảnh";position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:13px}
.ph:hover{transform:scale(1.03);box-shadow:0 10px 28px rgba(0,0,0,.25);z-index:2}
body.edit .ph{outline:2px dashed var(--line);cursor:grab;touch-action:none;transition:none;user-select:none}
body.edit .ph:hover{transform:none;box-shadow:none}
body.edit .ph.sel{outline:3px solid var(--line);z-index:5}
body.edit .hero .t,body.edit .std .big,body.edit .std .s,body.edit .hk .tx,body.edit .dc{pointer-events:none}
body.edit .ph.empty::before{content:"+ Bấm để chọn ảnh"}
.hero{position:relative;padding:0;text-align:left}
.hero .ph{height:300px}
.hero .t{position:absolute;top:14px;right:14px;width:56%;text-align:center;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);font-size:13px}
.hero .t b{font-family:'Playfair Display',serif;font-size:22px;display:block;line-height:1.15}
.hero .t b i{font-weight:400}
.std{position:relative;padding:0}
.std .ph{height:260px}
.std .big{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:baseline;padding:0 8px;color:#fff;font-family:'Playfair Display',serif;font-size:62px;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.std .big em{font-family:'Allura',cursive;font-size:44px}
.std .s{position:absolute;top:14px;left:12px;right:12px;display:flex;justify-content:space-between;color:#fff;font-size:13px;text-shadow:0 1px 6px #000}
.sub{margin:10px auto 22px;font-size:15px;max-width:360px}
.sp{letter-spacing:.14em;font-size:20px;display:inline-block;padding-bottom:8px;border-bottom:2px solid var(--line);margin-bottom:20px;text-transform:uppercase}
.evt{margin-bottom:24px}
.evt .ph{width:100%;aspect-ratio:1/1;margin-bottom:16px}
.evt b{display:block;font-size:16px}
.evt .place{font-size:20px;margin-top:10px}
.btn{display:block;width:100%;margin-top:12px;padding:12px;border-radius:28px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);font:700 14px 'Mulish',sans-serif;cursor:pointer;text-decoration:none;transition:transform .25s,background .25s,color .25s;text-align:center}
.btn:hover{background:var(--fg);color:var(--bg);transform:translateY(-3px)}
.btn.soft{border-color:var(--ac);color:var(--mut)}
.cd .script{font-family:'Dancing Script',cursive;font-weight:700;font-size:34px;text-align:center;line-height:1.2;margin-bottom:6px}
.cdg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.cdg div{background:var(--ac);color:#fff;border-radius:8px;padding:10px 0;font-size:13px;font-weight:700;transition:transform .3s}
.cdg div:hover{transform:translateY(-4px) rotate(-2deg)}
.cdg span{display:block;font-size:30px;line-height:1.1}
.cd p{font-family:'Playfair Display',serif;font-weight:700;text-align:right;font-size:14px}
.hk{position:relative;height:300px;margin:0 -20px;background:#3a2e28}
.hk .ph{position:absolute;width:42%;height:62%}
.hk .a{left:12%;top:8%}.hk .b{left:46%;top:8%}
.hk .tx{position:absolute;bottom:14px;left:0;right:0;color:#fff;font-family:'Playfair Display',serif;font-size:20px}
.cal{display:grid;grid-template-columns:1fr 1.25fr;gap:16px;text-align:left;align-items:start}
.cal .mo{font-family:'Playfair Display',serif;font-size:44px;line-height:1}
.cal small{font-family:'Playfair Display',serif;font-style:italic;display:block}
.cg{background:var(--card);border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;text-align:center;font-size:13px}
.cg b{font-weight:700}
.cg span{height:26px;line-height:26px;border-radius:50%;transition:background .2s}
.cg span:hover{background:rgba(217,119,122,.3)}
.cg span.on{box-shadow:inset 0 0 0 2px var(--line);font-weight:700;color:var(--line)}
.pair{position:relative;height:340px;margin-top:20px;text-align:left}
.pair .p1{position:absolute;left:62px;top:0;width:68%;height:62%}
.pair .p2{position:absolute;right:0;top:48%;width:48%;height:52%}
.dc{position:absolute;left:0;top:10px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.dc em{writing-mode:vertical-rl;font-style:normal;letter-spacing:.12em}
.dc i{width:18px;height:18px;border-radius:50%;display:block}
.tl{display:flex;flex-direction:column;gap:14px;text-align:left;margin:10px 0 0}
.tl div{display:flex;gap:14px;align-items:center;transition:transform .3s}
.tl div:hover{transform:translateX(8px)}
.tl small{display:block;font-size:14px}.tl b{font-size:14px}
.tlh{font-size:38px;font-weight:400;letter-spacing:.02em;text-align:left;margin-top:16px;line-height:1}
.cpl .ph{height:260px;margin:0 -20px}
.pr{display:flex;gap:14px;align-items:center;margin:20px 0;text-align:left}
.pr .ph{width:42%;aspect-ratio:3/4;flex:none}
.pr p{font-size:14px}
.pr.r{flex-direction:row-reverse}
.nm{font-family:'Dancing Script',cursive;font-weight:700;font-size:36px;line-height:1.1;margin:8px 0;text-align:center}
.alb{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:14px}
.alb .ph{grid-column:span 3;aspect-ratio:3/4}
.alb .ph:nth-child(n+5){grid-column:span 2}
form{text-align:left;display:flex;flex-direction:column;gap:12px;margin-top:14px;font-family:'Playfair Display',serif;font-style:italic}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--fg);border-radius:6px;background:transparent;color:var(--fg);font:italic 16px 'Playfair Display',serif;transition:box-shadow .25s}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(217,119,122,.4)}
.rd{display:flex;gap:12px;flex-wrap:wrap;padding:10px;border:1.5px solid var(--fg);border-radius:6px}
.rd label{display:flex;gap:4px;align-items:center}.rd input{width:auto}
.ok{background:var(--ac);color:#fff;border:0;border-radius:10px;font-weight:700;padding:14px;cursor:pointer;transition:transform .25s,background .25s;width:50%;align-self:center}
.ok:hover{background:var(--line);transform:scale(1.06)}
.ty .ph{width:200px;height:200px;border-radius:50%;margin:10px auto 24px}
.ty .script{font-family:'Dancing Script',cursive;font-weight:700;font-size:38px;display:block}
.ty h3{font-family:'Playfair Display',serif;font-size:19px;margin-top:20px}
.fx{position:fixed;z-index:30;border:0;border-radius:50%;width:42px;height:42px;background:var(--ac);color:#fff;cursor:pointer;font-size:18px;opacity:.9;transition:transform .25s}
.fx:hover{transform:scale(1.15)}
#up{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#mu{left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#ed{left:14px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--line)}
#mu.on{animation:sp 4s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s,transform .9s}.rv.in{opacity:1;transform:none}
.heart{position:fixed;pointer-events:none;z-index:40;font-size:16px;color:var(--line);animation:fl 1.2s forwards}
@keyframes fl{to{transform:translateY(-60px) scale(1.6);opacity:0}}
#pn{position:fixed;left:0;right:0;bottom:0;max-height:36vh;overflow:auto;background:var(--bg);border-top:2px solid var(--line);z-index:50;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:none;font:14px 'Mulish',sans-serif}
#pn.open{display:block}
#pn .in{max-width:480px;margin:0 auto}
#pn label{display:block;margin:8px 0 2px;color:var(--mut);font-size:12px}
#pn input,#pn textarea{font:14px 'Mulish',sans-serif;padding:8px;border-width:1px}
#pn h4{margin:14px 0 2px;font-size:15px}
#pn .btn{margin-top:8px;padding:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<button class="fx" id="mu" title="Bật/tắt nhạc" aria-label="Bật/tắt nhạc">♪</button>
<button class="fx" id="ed" title="Chỉnh sửa thông tin" aria-label="Chỉnh sửa">✎</button>
<button class="fx" id="up" title="Lên đầu trang" aria-label="Lên đầu trang">↑</button>
<audio id="au" loop></audio>
<div id="tb"><label class="tbb" for="fi">Chọn / đổi ảnh</label><button data-a="m">Kéo: khung</button><button data-a="s-">Khung −</button><button data-a="s+">Khung +</button><button data-a="z-">Ảnh −</button><button data-a="z+">Ảnh +</button><button data-a="r">Đặt lại</button><button data-a="x">Xoá ảnh</button></div>
<input type="file" id="fi" accept="image/*" class="vh">
<div id="pn"><div class="in"></div></div>

<script>
const DEF={
 groom:"Đức Khánh",bride:"Hải Ngọc",short:"Khánh & Ngọc",
 quote:"I love you not because of who you are, but because of who I am when I am with you",
 date:"2025-07-15",dateLabel:"July 15",time:"11:00",
 intro:"Sự hiện diện của tất cả bạn, các quan khách, luôn là niềm vui niềm hạnh phúc của gia đình và vợ chồng mình",
 b:{title:"Tiệc cưới nhà gái",when:"10:00 Thứ 4, ngày 14/05/2025",lunar:"(Tức ngày 17/04 Ất Tỵ)",place:"Tư Gia Nhà Gái",addr:"Bàn Thạch, Đà Nẵng",map:"https://www.google.com/maps/search/?api=1&query=Ban+Thach+Da+Nang"},
 g:{title:"Tiệc cưới nhà trai",when:"11:00 Thứ 5, ngày 15/05/2025",lunar:"(Tức ngày 18/04 Ất Tỵ)",place:"Tư Gia Nhà Trai",addr:"Bàn Thạch, Đà Nẵng",map:"https://www.google.com/maps/search/?api=1&query=Ban+Thach+Da+Nang"},
 countTo:"2025-07-15T11:30:00",countText:"Until we officially become Mr. & Mrs.",
 tl:[{t:"11:00 AM",n:"ĐÓN KHÁCH"},{t:"11:30 AM",n:"LỄ CƯỚI"}],
 dress:["#000000","#9a7b4f","#f1e2d0"],
 brideQ:"Ai bảo con gái lấy chồng là đau khổ? Hôm nay, em chính thức được cấp phép làm việc dũng mãnh đời rồi đây! Cảm ơn anh đã đồng ý ‘kết án’ em. Em hứa sẽ luôn mang đến cho anh những tiếng cười và niềm vui. Và à, anh nhớ là người phải rửa bát nhé!",
 groomQ:"Em yêu, suốt thời gian qua, em đã luôn là nguồn cảm hứng lớn nhất của anh. Yêu em, anh đã trở thành một người đàn ông tốt hơn. Hôm nay, khi hai ta chính thức về chung một nhà, anh muốn nói rằng, anh yêu em nhiều hơn bất cứ điều gì trên đời này.",
 albumTitle:"Album ảnh của chúng tôi!",
 rsvpIntro:"Đám cưới của chúng tôi sẽ trọn vẹn với sự hiện diện của Quý Khách. Vui lòng xác nhận thông tin dưới đây để gia đình chuẩn bị tiếp đón một cách chu đáo nhất. Trân trọng!",
 music:""
};

const app = document.getElementById('app');

function renderApp() {
  app.innerHTML = `
    <section class="hero rv">
      <div class="ph empty" id="ph-hero"></div>
      <div class="t">
        <p>SAVE THE DATE</p>
        <b>${DEF.groom} <i>&</i> ${DEF.bride}</b>
        <p>${DEF.dateLabel}</p>
      </div>
    </section>

    <section class="std rv">
      <div class="ph empty" id="ph-std"></div>
      <div class="s"><span>WE ARE GETTING MARRIED</span><span>${DEF.dateLabel}</span></div>
      <div class="big"><span>SAVE</span><em>the</em><span>DATE</span></div>
    </section>

    <section class="rv">
      <h2 class="script">Lời Mời</h2>
      <p class="sub">${DEF.intro}</p>
      <div class="sp">Lễ Cưới</div>
      
      <div class="evt">
        <div class="ph empty" id="ph-bEvt"></div>
        <b>${DEF.b.title}</b>
        <p>${DEF.b.when}</p>
        <small>${DEF.b.lunar}</small>
        <div class="place">${DEF.b.place}</div>
        <p>${DEF.b.addr}</p>
        <a href="${DEF.b.map}" target="_blank" class="btn">XEM BẢN ĐỒ</a>
      </div>

      <div class="evt">
        <div class="ph empty" id="ph-gEvt"></div>
        <b>${DEF.g.title}</b>
        <p>${DEF.g.when}</p>
        <small>${DEF.g.lunar}</small>
        <div class="place">${DEF.g.place}</div>
        <p>${DEF.g.addr}</p>
        <a href="${DEF.g.map}" target="_blank" class="btn">XEM BẢN ĐỒ</a>
      </div>
    </section>

    <section class="cd rv">
      <div class="script">Đếm Ngược</div>
      <div class="cdg">
        <div><span id="cd-d">00</span>Ngày</div>
        <div><span id="cd-h">00</span>Giờ</div>
        <div><span id="cd-m">00</span>Phút</div>
        <div><span id="cd-s">00</span>Giây</div>
      </div>
      <p>${DEF.countText}</p>
    </section>

    <section class="hk rv">
      <div class="ph a empty" id="ph-c1"></div>
      <div class="ph b empty" id="ph-c2"></div>
      <div class="tx">${DEF.short}</div>
    </section>

    <section class="rv">
      <div class="cal">
        <div>
          <div class="mo">JULY</div>
          <small>2025</small>
        </div>
        <div class="cg">
          <b>S</b><b>M</b><b>T</b><b>W</b><b>T</b><b>F</b><b>S</b>
          <span></span><span></span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
          <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span>
          <span>13</span><span>14</span><span class="on">15</span><span>16</span><span>17</span><span>18</span><span>19</span>
          <span>20</span><span>21</span><span>22</span><span>23</span><span>24</span><span>25</span><span>26</span>
          <span>27</span><span>28</span><span>29</span><span>30</span><span>31</span>
        </div>
      </div>

      <div class="pair">
        <div class="dc">
          <em>D R E S S C O D E</em>
          ${DEF.dress.map(c => `<i style="background:${c}"></i>`).join('')}
        </div>
        <div class="ph p1 empty" id="ph-cal1"></div>
        <div class="ph p2 empty" id="ph-cal2"></div>
      </div>

      <div class="tlh">Program</div>
      <div class="tl">
        ${DEF.tl.map(item => `
          <div>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <div><small>${item.t}</small><b>${item.n}</b></div>
          </div>
        `).join('')}
      </div>
    </section>

    <section class="cpl rv">
      <div class="ph empty" id="ph-cover"></div>
      <div class="pr">
        <div class="ph empty" id="ph-bP"></div>
        <div>
          <div class="nm">${DEF.bride}</div>
          <p>${DEF.brideQ}</p>
        </div>
      </div>
      <div class="pr r">
        <div class="ph empty" id="ph-gP"></div>
        <div>
          <div class="nm">${DEF.groom}</div>
          <p>${DEF.groomQ}</p>
        </div>
      </div>
    </section>

    <section class="rv">
      <h2>${DEF.albumTitle}</h2>
      <div class="alb">
        <div class="ph empty" id="ph-a1"></div>
        <div class="ph empty" id="ph-a2"></div>
        <div class="ph empty" id="ph-a3"></div>
        <div class="ph empty" id="ph-a4"></div>
        <div class="ph empty" id="ph-a5"></div>
        <div class="ph empty" id="ph-a6"></div>
      </div>
    </section>

    <section class="rv">
      <h2>Xác Nhận Tham Dự</h2>
      <p class="sub">${DEF.rsvpIntro}</p>
      <form onsubmit="event.preventDefault(); alert('Cảm ơn bạn đã xác nhận!');">
        <input type="text" placeholder="Họ và tên của bạn" required>
        <select>
          <option>Tôi sẽ đến tham dự</option>
          <option>Rất tiếc tôi không thể đến</option>
        </select>
        <input type="number" placeholder="Số người đi cùng" min="0" value="0">
        <textarea rows="3" placeholder="Lời chúc gửi tới cô dâu chú rể..."></textarea>
        <button class="ok" type="submit">GỬI XÁC NHẬN</button>
      </form>
    </section>

    <section class="ty rv">
      <div class="ph empty" id="ph-ty"></div>
      <span class="script">Thank You!</span>
      <h3>${DEF.short}</h3>
    </section>
  `;
}

renderApp();

// Countdown Timer
function startCountdown() {
  const target = new Date(DEF.countTo).getTime();
  setInterval(() => {
    const now = new Date().getTime();
    const diff = target - now;
    if (diff > 0) {
      document.getElementById('cd-d').innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
      document.getElementById('cd-h').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
      document.getElementById('cd-m').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
      document.getElementById('cd-s').innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
    }
  }, 1000);
}
startCountdown();

// Scroll Animations & Controls
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add('in');
  });
}, { threshold: 0.1 });

document.querySelectorAll('.rv').forEach(el => observer.observe(el));

document.getElementById('up').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

// Heart floating animation on click
document.addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'A') {
    const h = document.createElement('div');
    h.className = 'heart';
    h.innerHTML = '♥';
    h.style.left = e.clientX + 'px';
    h.style.top = e.clientY + 'px';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1200);
  }
});
</script>
</body>
</html>
